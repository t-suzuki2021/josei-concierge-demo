<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-app-32.png">
<link rel="icon" type="image/svg+xml" href="favicon-app.svg">
<link rel="apple-touch-icon" href="favicon-app-180.png">
<title>人材開発支援助成金コンシェルジュ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: a top bar switches three views. Overview is a single reading column.
   Staff is a sidebar + work area (today, cases, case detail with a stage timeline, customers, help, integrations, settings).
   Client is a 400px phone column with reviewer notes beside it. Same system as the AI subsidy concierge, different brand hue. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#EAEDF2; --fg:#181C25; --body:#444B57; --muted:#687080; --line:#D6DBE3; --line-2:#E7EAF0;
  --brand-l:#2E4C8C; --brand-d:#93B1EE; --brand-pale-l:#E5EBF7; --brand-pale-d:#1C2A46;
  --brand:var(--brand-l); --brand-pale:var(--brand-pale-l); --on-brand:#FFFFFF;
  --amber:#8A4A0C; --amber-pale:#F8ECDD;
  --ok:#1B7448; --ok-pale:#DDF1E5; --warn:#B3362B; --warn-pale:#F9E3E0; --info:#0E6A70; --info-pale:#DFF0F0;
  --shadow:0 1px 2px rgba(18,24,40,.06),0 10px 28px rgba(18,24,40,.08);
  --num:'IBM Plex Sans','Noto Sans JP',system-ui,sans-serif; --jp:'Noto Sans JP','Yu Gothic UI','Hiragino Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171C26; --sunk:#121720; --fg:#E9ECF2; --body:#C3C9D3; --muted:#8D95A3; --line:#2B3240; --line-2:#212734;
  --brand:var(--brand-d); --brand-pale:var(--brand-pale-d); --on-brand:#0F131A;
  --amber:#E8AC70; --amber-pale:#3A2A16;
  --ok:#5CCB8B; --ok-pale:#153826; --warn:#F08A7E; --warn-pale:#3F1F1B; --info:#6CC7CC; --info-pale:#163436;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C26; --sunk:#121720; --fg:#E9ECF2; --body:#C3C9D3; --muted:#8D95A3; --line:#2B3240; --line-2:#212734;
  --brand:var(--brand-d); --brand-pale:var(--brand-pale-d); --on-brand:#0F131A;
  --amber:#E8AC70; --amber-pale:#3A2A16;
  --ok:#5CCB8B; --ok-pale:#153826; --warn:#F08A7E; --warn-pale:#3F1F1B; --info:#6CC7CC; --info-pale:#163436;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:14px;line-height:1.65;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
input[type=text],input[type=email],input[type=number],input[type=search],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{line-height:1.65;resize:vertical}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:15px;height:15px}
.ic.l{width:22px;height:22px}
.muted{color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.tbc{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-pale);border-radius:4px;padding:0 6px;margin-left:4px;white-space:nowrap;vertical-align:1px}

/* top bar */
.top{max-width:1180px;margin:0 auto 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;line-height:1.3}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.views{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.views button{border:0;background:transparent;border-radius:7px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.views button[aria-current=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tenant{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tenant select{width:auto;padding:6px 8px;font-size:12.5px}

/* buttons, chips, cards */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;line-height:1.3;text-align:center;white-space:nowrap}
.btn.p{background:var(--brand);color:var(--on-brand)}
.btn.o{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn.g{background:var(--sunk);color:var(--body)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 20px;font-size:15px}
.btn.block{width:100%;white-space:normal}
.btn:disabled{opacity:.45;cursor:default}
.lnk{border:0;background:none;padding:0;color:var(--brand);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;text-align:left}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-pale);color:var(--ok)}
.chip.warn{background:var(--warn-pale);color:var(--warn)}
.chip.amber{background:var(--amber-pale);color:var(--amber)}
.chip.info{background:var(--info-pale);color:var(--info)}
.chip.brand{background:var(--brand-pale);color:var(--brand)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.sw{position:relative;width:40px;height:23px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked=true]{background:var(--brand)}
.sw[aria-checked=true] i{left:20px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--brand-pale)}

/* overview */
.ov{display:flex;flex-direction:column;gap:44px;max-width:1040px}
.ov section{display:flex;flex-direction:column;gap:16px}
.ov h2{font-size:21px}
.ov .lead{font-size:15px;color:var(--body);max-width:44em}
.ov section.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.hero-t{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero h1{font-size:clamp(25px,3.6vw,34px);font-weight:700;letter-spacing:.01em}
.hero h1 span{display:inline-block}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.cmp{padding:6px 18px}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto minmax(0,1.1fr);gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cmp-r:last-child{border-bottom:0}
.cmp-k{font-size:12.5px;color:var(--muted);font-weight:700}
.cmp-b{font-size:13.5px;color:var(--muted);text-decoration:line-through}
.cmp-a{font-size:17px;font-weight:700;color:var(--brand)}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.val{padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.val-h{display:flex;align-items:center;gap:10px}
.val-ic{width:36px;height:36px;border-radius:10px;background:var(--brand-pale);color:var(--brand);display:grid;place-items:center;flex:none}
.val h3{font-size:17px}
.val li,.dots li{position:relative;padding-left:18px;font-size:13.5px;color:var(--body)}
.val li::before,.dots li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.val ul,.dots{display:flex;flex-direction:column;gap:5px}
.val .lnk{margin-top:auto;padding-top:6px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three .card{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.three h3{font-size:15px}
.three p{font-size:13px;color:var(--body)}
.note{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-color:var(--brand);background:var(--brand-pale)}
.note .ic{color:var(--brand);margin-top:2px}
.note h3{font-size:15px;margin-bottom:2px}
.note p{font-size:13.5px;color:var(--body)}
.note.am{border-color:var(--amber);background:var(--amber-pale)}
.note.am .ic{color:var(--amber)}

/* stage timeline (shared by overview, case detail, client) */
.tline{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative}
.tstep{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 4px;border:0;background:none;min-width:0}
.tstep::before{content:"";position:absolute;top:14px;left:0;right:0;height:3px;background:var(--line)}
.tstep:first-child::before{left:50%} .tstep:last-child::before{right:50%}
.tstep.d::before{background:var(--brand)}
.tstep.c::before{background:linear-gradient(90deg,var(--brand) 50%,var(--line) 50%)}
.tstep:first-child.c::before{background:var(--line)}
.tdot{position:relative;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:12.5px;color:var(--muted);z-index:1}
.tstep.d .tdot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tstep.c .tdot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--brand-pale)}
.tname{font-size:12.5px;font-weight:700;line-height:1.35}
.tstep.c .tname{color:var(--brand)}
.tdate{font-size:11.5px;color:var(--muted);line-height:1.4}
.tstep.c .tdate{color:var(--fg);font-weight:700}
.here{font-size:10.5px;font-weight:700;color:var(--on-brand);background:var(--brand);border-radius:999px;padding:0 8px;line-height:1.7}
button.tstep:hover .tname{text-decoration:underline}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tbar b{font-size:15px}
.sdet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2);margin-top:16px}
.sdet>div{padding:14px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.sdet>div:last-child{border-right:0}
.sdet h4{font-size:12px;color:var(--muted);letter-spacing:.08em}
.sdet p,.sdet li{font-size:13px;color:var(--body)}
.sdet .due{font-size:14px;font-weight:700;color:var(--fg)}

/* staff */
.st{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--body);text-align:left;white-space:nowrap}
.side button[aria-current=true]{background:var(--brand-pale);color:var(--brand)}
.side .cnt{margin-left:auto;background:var(--warn);color:var(--surface);border-radius:999px;font-size:11px;padding:0 7px;font-family:var(--num)}
.acct{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:18px}
.acct .av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand-pale);color:var(--brand);display:grid;place-items:center}
.acct .fld{flex:none;min-width:230px}
.acct p{flex:1;min-width:240px;font-size:13px;margin:0}
.acct p .tiny{display:block;margin-top:2px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.roles>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.roles b{color:var(--fg);font-size:14px}
.own{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.side .new{margin-bottom:12px;justify-content:center;background:var(--brand);color:var(--on-brand)}
.side .bn{margin-top:14px;display:flex;flex-direction:column;gap:3px;border-radius:12px;padding:12px 14px;background:var(--brand);color:var(--on-brand);text-decoration:none;white-space:normal;line-height:1.45}
.side .bn:hover{filter:brightness(1.08)}
.side .bn small{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.85}
.side .bn b{font-size:14px;display:flex;align-items:center;gap:8px}
.side .bn b svg{width:18px;height:18px;flex:none}
.side .bn span{font-size:12px;opacity:.92}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px}
.ph .sub{font-size:13px;color:var(--muted)}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.todo{display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:center}
.td:last-child{border-bottom:0}
.td-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.td-ic.warn{background:var(--warn-pale);color:var(--warn)} .td-ic.info{background:var(--info-pale);color:var(--info)}
.td-ic.amber{background:var(--amber-pale);color:var(--amber)} .td-ic.ok{background:var(--ok-pale);color:var(--ok)}
.td-k{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.td-t{font-size:15px;font-weight:700;line-height:1.45}
.td-d{font-size:13px;color:var(--body)}
.td-a{display:flex;gap:8px;align-items:center}
.done-b{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.done-b:hover{border-color:var(--ok);color:var(--ok)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.sidecard h3{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.sb{display:grid;grid-template-columns:7.2em minmax(0,1fr) 1.6em;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.sb i{display:block;height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.sb .tr{background:var(--sunk);border-radius:4px}
.sb .num{text-align:right;font-weight:700}
.dl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line-2);align-items:center}
.dl li:last-child{border-bottom:0}
.dl b{display:block;font-size:13px}
.auto li{display:flex;gap:8px;font-size:12.5px;color:var(--body);padding:5px 0;border-bottom:1px dashed var(--line-2)}
.auto li:last-child{border-bottom:0}
.auto .ic{color:var(--ok);margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:12px 16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column}
.tile[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .n{font-size:26px;font-weight:700;line-height:1.25}
.tile.w .n{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input{max-width:260px}
.seg2{display:flex;background:var(--sunk);border-radius:8px;padding:3px;margin-left:auto}
.seg2 button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--surface);color:var(--fg)}
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol h3{font-size:12.5px;padding:4px 6px;display:flex;justify-content:space-between;color:var(--body)}
.kc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.kc:hover{border-color:var(--brand)}
.kc b{font-size:13.5px;line-height:1.4}
.kc-m{font-size:12px;color:var(--muted)}
.kc-x{font-size:12px;color:var(--warn);font-weight:700;line-height:1.45}
.pipe{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.pipe i{width:12px;height:7px;border-radius:2px;background:var(--line);display:inline-block}
.pipe i.d{background:var(--brand)} .pipe i.c{background:var(--amber)}
.pipe span{font-size:12.5px;margin-left:6px}
.back{align-self:flex-start}
.blocked{border-color:var(--warn);background:var(--warn-pale);color:var(--warn);padding:12px 16px;font-weight:700;font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.grp h3{font-size:12px;color:var(--muted);letter-spacing:.08em;padding:12px 18px 4px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px;padding:9px 18px;border-top:1px solid var(--line-2)}
.ci .w{font-size:12px;color:var(--muted);text-align:right}
.nx{border-color:var(--brand);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.nx h3{font-size:16px}
.nx p{font-size:13px;color:var(--body)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 18px;border-top:1px solid var(--line-2)}
.chk:first-child{border-top:0}
.chk.bad{background:var(--warn-pale)}
.chk b{font-size:13.5px;display:block}
.chk p{font-size:12.5px;color:var(--body)}
.chk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dcard{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px 18px}

.ex{display:grid;grid-template-columns:8.5em minmax(0,1fr) auto;gap:4px 10px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line-2);align-items:center}

.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}

.ap{display:grid;grid-template-columns:11em minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 18px;border-top:1px solid var(--line-2);font-size:13.5px}

.ap .v{word-break:break-word}
.tl{padding:6px 18px}
.tl li{display:grid;grid-template-columns:5.5em 20px minmax(0,1fr);gap:10px;padding:9px 0;font-size:13.5px}
.tl .t{font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin:6px auto 0}
.tl .dot.a{background:var(--info)} .tl .dot.c{background:var(--amber)}
.tl .sum{margin-top:6px;background:var(--info-pale);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--body)}
.opps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opp{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.opp h3{font-size:15px}
.opp p{font-size:13px;color:var(--body)}
.opp .of{font-size:13.5px;font-weight:700;color:var(--brand)}
.opp .btn{align-self:flex-start;margin-top:auto}
.lk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lkc{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lkc .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lkc h3{font-size:14.5px}
.lkc p{font-size:12.5px;color:var(--body)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr) auto;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line-2);font-size:13.5px}
.rule:first-child{border-top:0}
.rule .ar{color:var(--muted)}
.set{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lb{font-size:12.5px;font-weight:700}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--fg)}
.prev{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:300px}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;min-width:0}
.tpl div.on{border-color:var(--brand);background:var(--brand-pale)}
.tpl b{display:block;font-size:13.5px}
.qrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.qrow:first-of-type{border-top:0}
.qrow span{flex:1;min-width:0}
/* help */
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hgrid .card{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hgrid h3{font-size:15px}
.hgrid p{font-size:13px;color:var(--body)}
.ctab th:first-child,.ctab td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.ctab th:first-child{background:var(--sunk)}
.ctab td{font-size:13px;vertical-align:top}
.ctab tr.rec td{background:color-mix(in srgb,var(--brand-pale) 60%,var(--surface))}
.ctab tr.rec td:first-child{background:color-mix(in srgb,var(--brand-pale) 60%,var(--surface))}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line-2);text-decoration:none;font-weight:700;font-size:13.5px}
.links a:first-child{border-top:0}
.links a span{font-weight:400;font-size:12px;color:var(--muted)}

/* client phone */
.cv{display:grid;grid-template-columns:minmax(0,400px) minmax(0,320px);gap:32px;justify-content:center;align-items:start}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);min-height:720px;display:flex;flex-direction:column}
.p-head{background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;display:flex;flex-direction:column;gap:3px}

.p-head p{font-size:13px;opacity:.92}
.p-due{margin-top:10px;background:color-mix(in srgb,var(--on-brand) 16%,transparent);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.p-due{flex-wrap:wrap}
.p-due b{font-family:var(--num);font-size:16px;white-space:nowrap}
.p-bar{display:flex;align-items:center;gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--line-2)}

.p-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.p-body h2{font-size:17px}
.p-body h3.sec{font-size:13px;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between}
.p-lead{font-size:13.5px;color:var(--body)}
.vline{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vs{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;width:100%}
.vs:first-child{border-top:0}
.vs .vd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--num);color:var(--muted)}
.vs.d .vd{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.vs.c{background:var(--brand-pale)}
.vs.c .vd{border-color:var(--brand);color:var(--brand)}
.vs b{font-size:13.5px;display:block;line-height:1.4}
.vs.d b{color:var(--muted);font-weight:500}
.vs span.dt{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.vs.c span.dt{color:var(--fg);font-weight:700}
.pre{border:1px solid var(--line);border-radius:12px;font-size:13px}
.pre summary{padding:11px 14px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.pre summary .ic{color:var(--ok)}
.pre .rows{padding:0 14px 10px}
.ir{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.ir .k{color:var(--muted);font-size:12px}
.ir .v{word-break:break-word;min-width:0}
.ir .v.na{color:var(--muted);font-size:12px}
.ir .s{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ir input{padding:5px 8px;font-size:13px}
.task{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.task:hover{border-color:var(--brand)}
.task .ti{width:42px;height:42px;border-radius:12px;background:var(--brand-pale);color:var(--brand);display:grid;place-items:center}
.task.done .ti{background:var(--ok-pale);color:var(--ok)}
.task.later{opacity:.62;border-style:dashed;cursor:default}
.task.later:hover{border-color:var(--line)}
.task b{display:block;font-size:15px;line-height:1.4;color:var(--fg)}
.task span{font-size:12.5px;color:var(--muted)}
.task .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.mins{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-family:var(--num)}
.p-help{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--body)}
.doc{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.doc.got{border-color:var(--ok);background:color-mix(in srgb,var(--ok-pale) 40%,var(--surface))}
.doc .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.doc h3{font-size:15px}
.doc .s{font-size:12px;color:var(--muted)}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap}
.doc .more{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.how{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--body)}
.exr{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.exr span:first-child{color:var(--muted)}
.exr b{font-weight:500;text-align:right}
.read{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--info);font-weight:700}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--info-pale);border-top-color:var(--info);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.q{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.q.okq{border-color:var(--ok)}
.okc{display:none}
.okq .okc{display:inline-flex}
.q label,.q .lb{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.q .h{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:11px 4px;color:var(--body);font-size:13.5px;border-right:1px solid var(--line);line-height:1.35}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;background:var(--brand-pale);border-radius:12px;padding:13px;font-size:14px;font-weight:700;color:var(--brand)}
.agree input{width:20px;height:20px;margin-top:1px;flex:none}
.fin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:28px 4px 8px}
.ring{width:66px;height:66px;border-radius:50%;background:var(--ok-pale);color:var(--ok);display:grid;place-items:center}
.left{align-self:stretch;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.left b{font-size:12px;color:var(--muted);letter-spacing:.06em}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--body);background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.plan b{color:var(--fg);font-size:13px}
.cnote{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.cnote h2{font-size:15px}
.cnote li{position:relative;padding-left:18px;font-size:13.5px;color:var(--body);margin-top:6px}
.cnote li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.mini{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.mini div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px;border-top:1px solid var(--line-2)}
.mini div:first-child{border-top:0}
.mini b{font-family:var(--num)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-bg{position:absolute;inset:0;background:rgba(10,14,22,.55)}
.modal-box{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(580px,100%);max-height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-size:18px;padding-right:36px}
.modal-box .x{position:absolute;top:12px;right:12px;border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.modal-box textarea{min-height:230px;font-size:13px}
.m-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.m-sec{display:flex;flex-direction:column;gap:4px}
.m-sec h4{font-size:12px;color:var(--muted);letter-spacing:.08em}
.m-sec p,.m-sec li{font-size:13.5px;color:var(--body)}
.wz{display:flex;gap:6px}
.wz i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wz i.on{background:var(--brand)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--body)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* curriculum builder */
.cur{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.cur-in{display:flex;flex-direction:column;gap:14px;padding:16px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--body)}
.pick[aria-pressed=true]{border-color:var(--brand);background:var(--brand-pale);color:var(--brand)}
.past{display:flex;flex-direction:column;gap:6px}
.sets{display:flex;flex-direction:column;gap:6px}
.setb{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;color:var(--body)}
.setb[aria-pressed=true]{border-color:var(--brand);background:var(--brand-pale)}
.setb b{font-size:13px;color:var(--fg);line-height:1.45}
.ctable .tag{display:inline-block;margin-left:6px;vertical-align:1px}
.past label{display:flex;gap:8px;align-items:flex-start;font-size:13px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.past input{margin-top:3px}
.ctable td,.ctable th{vertical-align:top}
.ctable .t{white-space:nowrap;font-family:var(--num);font-size:12.5px;color:var(--muted)}
.ctable .h{white-space:nowrap;font-family:var(--num);font-weight:700;text-align:right}
.ctable tr.lunch td{color:var(--muted);background:var(--sunk);font-size:12px}
.ctable tr.day td{background:var(--brand-pale);color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 12px}
.ctable b{display:block;font-size:13.5px}
.ctable .rel{font-size:12px;color:var(--muted);margin-top:2px}
.ctable tfoot td{font-weight:700;border-top:2px solid var(--line)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-color:var(--info);background:var(--info-pale);font-size:13.5px}
.gen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 16px;text-align:center;color:var(--body)}
/* partners */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc h3{font-size:15.5px}
.addp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}

@media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} .lk,.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .sdet{grid-template-columns:repeat(2,minmax(0,1fr))} .sdet>div:nth-child(2){border-right:0} .sdet>div:nth-child(-n+2){border-bottom:1px solid var(--line-2)} .calc{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .st{grid-template-columns:minmax(0,1fr)} .side{flex-direction:row;overflow-x:auto;padding-bottom:6px} .side button{flex:none} .side .new{margin:0 6px 0 0} .side .new{order:-2} .side .bn{order:-1;margin:0 6px 0 0;flex:none;justify-content:center;padding:8px 14px;white-space:nowrap} .side .bn small,.side .bn span{display:none}
  .cur{grid-template-columns:minmax(0,1fr)} .addp{grid-template-columns:minmax(0,1fr)}
  .ov section.hero{grid-template-columns:minmax(0,1fr)} .cv{grid-template-columns:minmax(0,400px)} .set{grid-template-columns:minmax(0,1fr)} .three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .tline{grid-template-columns:minmax(0,1fr);gap:0}
  .tstep{flex-direction:row;align-items:center;text-align:left;gap:12px;padding:6px 0;flex-wrap:wrap}
  .tstep::before{top:0;bottom:0;left:14px;right:auto;width:3px;height:auto}
  .tstep:first-child::before{left:14px;top:50%} .tstep:last-child::before{right:auto;bottom:50%}
  .tstep.c::before{background:linear-gradient(180deg,var(--brand) 50%,var(--line) 50%)}
  .tname{min-width:6.5em}
}
@media (max-width:640px){
  .vals,.opps,.lk,.tpl,.hgrid,.pgrid,.roles{grid-template-columns:minmax(0,1fr)} .acct .fld{flex:1;min-width:0} .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .td{grid-template-columns:38px minmax(0,1fr)} .td-a{grid-column:1/-1;justify-content:flex-end}
  .dcard{grid-template-columns:minmax(0,1fr)} .thumb{display:none}
  .sdet{grid-template-columns:minmax(0,1fr)} .sdet>div{border-right:0;border-bottom:1px solid var(--line-2)} .sdet>div:last-child{border-bottom:0}
  .rule{grid-template-columns:minmax(0,1fr) auto} .rule .ar{display:none} .rule .then{grid-column:1/2;color:var(--muted);font-size:12.5px}
  .ap{grid-template-columns:minmax(0,1fr) auto} .ap .k{grid-column:1/-1}
  .chk{grid-template-columns:auto minmax(0,1fr)} .chk .acts{grid-column:1/-1;justify-content:flex-start}
  .cmp-r{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)} .cmp-k{grid-column:1/-1}
  .calc{grid-template-columns:minmax(0,1fr)} .calc .out{grid-template-columns:minmax(0,1fr)}
  .tenant{margin-left:0}
}
/* manual */
.man{display:flex;flex-direction:column;gap:18px}
.mstat{padding:12px 16px;font-size:13px;color:var(--body);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.mstat b{font-family:var(--num)}
.mtoc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mtoc .card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mtoc .ls{display:flex;flex-wrap:wrap;gap:6px}
.mtoc .ls button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--body)}
.mgrp{display:flex;flex-direction:column;gap:12px}
.mgrp>h2{font-size:18px;margin-top:6px}
.mpg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:18px;scroll-margin-top:12px}
.mpg-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.mpg h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mpath{font-size:12.5px;color:var(--muted)}
.mpath b{color:var(--body)}
.mpg h4{font-size:13px;margin-top:4px}
.mops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.mops li{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.mops li b{color:var(--fg)}
.mops li span{color:var(--body)}
.mpg .btn{align-self:flex-start;margin-top:4px}
.mshot{position:relative;height:250px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg);align-self:start}
.mshot-in{transform-origin:0 0;pointer-events:none;padding:12px}
.mshot::after{content:'';position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(180deg,transparent,var(--bg))}
.mshot .phone{min-height:0;box-shadow:none}
.mshot .mbox{position:static;width:auto;max-height:none;margin-bottom:12px}
@media (max-width:860px){ .mpg{grid-template-columns:minmax(0,1fr)} .mtoc{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .views{width:100%} .views button{flex:1;padding:7px 4px;font-size:12.5px} .mops li{grid-template-columns:minmax(0,1fr)} .mshot{height:210px} }
@media (prefers-reduced-motion:reduce){ .spin{animation:none} .sw i{transition:none} }
/* ---------- 年間プラン（研修メニューと連動） ---------- */
.seg.s3 button{font-size:13px;padding:9px 4px}
.seg.s3 button small{display:block;font-size:10.5px;font-weight:400;opacity:.85}
.ypnote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--body);background:var(--brand-pale);border-radius:8px;padding:8px 10px}
.pick.auto{border-style:dashed;border-color:var(--brand);color:var(--brand)}
.ypg{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border-top:1px solid var(--line-2)}
.ypg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ypc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ypc .setb{height:100%}
.ypc .setb:disabled{opacity:.45;cursor:not-allowed}
.ypc .setb .h{display:flex;gap:4px;flex-wrap:wrap}
.ypst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 18px}
.ypst div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ypst span{font-size:12px;color:var(--muted)}
.ypst b{font-size:16px;font-family:var(--num);color:var(--fg);line-height:1.35}
.ypst small{font-size:11.5px;color:var(--muted)}
.ypi{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.ypi-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ypi h3{font-size:15px}
.ypi .goal{font-size:12.5px;color:var(--body)}
.ypi ol{margin:2px 0 0;padding-left:20px;font-size:12.5px;color:var(--body);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.ypi ol li.hit{color:var(--brand);font-weight:700}
.ypi .when{font-size:12px;color:var(--muted)}
.ypi .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ypcov{padding:12px 18px;border-top:1px solid var(--line-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.ypcov ul{margin:0;padding-left:18px}
.ypwarn{margin:0 18px 14px;padding:10px 12px;border-radius:8px;background:var(--warn-pale);color:var(--warn);font-size:12.5px}
.ypwarn ul{margin:4px 0 0;padding-left:18px}
/* ---------- 申請書類 ---------- */
.fhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fhead .seg2{margin-left:0}
.fstep{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 18px;counter-reset:fs}
.fstep li{list-style:none;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0}
.fstep li::before{counter-increment:fs;content:counter(fs);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-family:var(--num)}
.fstep li.done{color:var(--ok)}
.fstep li.done::before{content:'✓';background:var(--ok-pale);color:var(--ok)}
.fstep li.now{color:var(--brand)}
.fstep li.now::before{background:var(--brand);color:var(--on-brand)}
.fsec{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px 6px}
.fsec h3{font-size:15px}
.fd{display:grid;grid-template-columns:12em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 18px;border-top:1px solid var(--line-2);font-size:13.5px}
.fd .k{color:var(--muted);font-size:12.5px}
.fd .v{word-break:break-word;min-width:0}
.fd input,.fd select{max-width:340px}
.fd .s{justify-self:end}
.fdoc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line-2)}
.fdoc .mk{font-size:15px;width:1.2em;text-align:center;color:var(--brand)}
.fdoc .mk.opt{color:var(--muted)}
.fdoc b{font-size:13.5px;display:block}
.fdoc p{font-size:12px;color:var(--muted)}
.fdoc .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fhand{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.fhand .acts{display:flex;gap:8px;flex-wrap:wrap}
.blank{color:var(--warn);font-weight:700}
.modal-box.wide{width:min(880px,100%)}
.f-lead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--body)}
.sheets{display:flex;flex-direction:column;gap:16px}
.sheet{background:#fff;color:#16181d;border:1px solid #c9ccd3;border-radius:4px;padding:20px 22px;font-size:12.5px;line-height:1.65;display:flex;flex-direction:column;gap:10px;font-family:var(--jp)}
.sheet h3{text-align:center;font-size:16px;letter-spacing:.08em;color:#16181d}
.sheet h4{font-size:13px;color:#16181d;border-left:3px solid #16181d;padding-left:6px;margin-top:4px}
.sheet p{color:#30343c}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sh-top .fno{font-size:11.5px;color:#555b66}
.sh-top .draft{border:1.5px solid #b3261e;color:#b3261e;font-weight:700;font-size:11px;padding:1px 8px;border-radius:4px;letter-spacing:.1em}
.sh-to{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.sheet table{width:100%;border-collapse:collapse;font-size:12px}
.sheet th,.sheet td{border:1px solid #9aa0aa;padding:5px 8px;text-align:left;vertical-align:top;color:#16181d}
.sheet th{background:#f1f2f4;font-weight:700}
.sheet .kvt th{width:34%}
.sheet .gt td.n,.sheet .gt th.n{text-align:right;font-family:var(--num);white-space:nowrap}
.sheet .gt tfoot td{font-weight:700;background:#f7f7f8}
.sheet .gt .x{background:#fde8e6;color:#b3261e;font-weight:700}
.sheet .ck{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sheet .ck li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.sheet .ck li::before{content:'□';color:#16181d}
.sheet .sign{display:flex;justify-content:flex-end;gap:16px;flex-wrap:wrap;font-size:12.5px;border-top:1px dashed #9aa0aa;padding-top:8px}
.sheet .sign span{min-width:12em}
.sh-foot{font-size:11px;color:#6a707b!important;border-top:1px solid #e3e5e9;padding-top:6px}
.sheet .blank{color:#b3261e}
@media (max-width:980px){ .ypc{grid-template-columns:repeat(2,minmax(0,1fr))} .ypst{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .ypc,.ypi ol{grid-template-columns:minmax(0,1fr)}
  .fstep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fd{grid-template-columns:minmax(0,1fr) auto} .fd .k{grid-column:1/-1}
  .fd input,.fd select{max-width:none}
  .fdoc{grid-template-columns:auto minmax(0,1fr)} .fdoc .r{grid-column:1/-1;justify-content:flex-start}
  .sheet{padding:14px 12px}
}
@media print{
  body.printing>*:not(#modal){display:none!important}
  body.printing #modal{position:static;display:block;padding:0;background:none}
  body.printing .modal-bg,body.printing .modal-box>.x,body.printing .m-acts,body.printing .f-lead{display:none!important}
  body.printing .modal-box{box-shadow:none;max-height:none;overflow:visible;width:auto;padding:0;background:#fff}
  body.printing .modal-box h2{display:none}
  body.printing .sheet{border:0;padding:0;break-after:page}
  body.printing .tscroll{overflow:visible}
}
/* accounts, ops, sr portal, AI check */

.views{overflow-x:auto;max-width:100%}
.views button{padding:7px 12px}
.topr{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}

.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;text-align:left;line-height:1.3;max-width:260px}

.dkic.warn{background:var(--warn-pale);color:var(--warn)}
.dkic.amber{background:var(--amber-pale);color:var(--amber)}
.dkic.info{background:var(--info-pale);color:var(--info)}
.dkn b{display:block;font-size:13.5px;line-height:1.4}

function layout(rows,H){const a=layout1(rows,H,1),b=layout1(rows,H,0);return b.days<a.days?b:a;} /* 切れ端なしで組み、日数が増えるときだけ分割を許す */
function layout1(rows,H,strict){const out=[];let day=0,used=H,clock=0,lunch=0;const tm=m=>Math.floor(m/60)+':'+pad(Math.round(m%60));
 rows.forEach(r=>{let left=r.h;const parts=[];
  while(left>0.001){
   if(used>=H-0.001){day++;used=0;clock=540;lunch=0;out.push({day});}
   if(H>4&&!lunch&&clock>=720){out.push({lunch:1,from:tm(clock),to:tm(clock+60)});clock+=60;lunch=1;}
   let take=Math.min(left,H-used);
   if(strict&&take<left-0.001&&take<0.999&&used>0&&left<=H){used=H;continue;} /* 1時間未満の切れ端は作らず翌日にまわす */
   if(H>4&&!lunch&&clock<720&&clock+take*60>720)take=(720-clock)/60;
   const p=Object.assign({},r,{from:tm(clock),to:tm(clock+take*60),h:Math.round(take*100)/100});out.push(p);parts.push(p);
   clock+=take*60;used+=take;left-=take;}
  if(parts.length>1)parts.forEach((p,i)=>{p.part=(i+1)+'/'+parts.length;});});
 return {sched:out,days:day};}

function kbSt(c,d){const lv=d.lvF?d.lvF(c):d.lv;if(lv==='m')return 'm';if(lv==='o')return 'o';return d.on(c)?'c':'na';}

function fS(c){S.forms=S.forms||{};if(S.forms[c.id])return S.forms[c.id];
 const f=S.forms[c.id]={ph:c.stage>=3?'apply':'plan',how:'out',agent:'sr',sui:c===MIDORI?'':c.stage>=2?FSUI[c.no%3]:'',place:c.curRes&&/オンライン/.test(c.curRes.mode)?'各自の職場（同時双方向型のオンライン）':'本社 会議室',work:8,made:{},sent:{plan:c.stage>=3,apply:c.stage>=5},gen:null,ask:{}};

function fData(c){const f=fS(c),d=dates(c),co=COURSE(c.course)||COURSES[0],mid=c===MIDORI,pf=FPREF[Math.max(0,CASES.indexOf(c))%FPREF.length],cr=c.curRes;

 if(cr){dayH=[];cr.sched.forEach(x=>{if(x.day)dayH.push({h:0,it:[]});else if(!x.lunch&&dayH.length){const t=dayH[dayH.length-1];t.h=Math.round((t.h+x.h)*100)/100;t.it.push(x);}});}
 else{const n=Math.max(1,Math.ceil(c.hours/H-0.001));dayH=Array.from({length:n},(_,j)=>{const h=j<n-1?H:Math.round((c.hours-H*(n-1))*100)/100;return {h,it:[{t:c.train,c:'研修会社のカリキュラムによる',from:'9:00',to:'',h}]};});}
 const days=dayH.length,span=Math.max(c.len-1,days-1);
 const dt=j=>{let x=addD(d.st,days>1?Math.round(j*span/(days-1)):0);while(x.getDay()===0||x.getDay()===6)x=addD(x,1);return x;};
 const jb=cr&&cr.job||(c.id===S.cur.tcid&&S.cur.src==='wish'&&S.cur.job)||CAT_IND[Math.max(0,indIdx(c))].jobs[0].n;
 const gap=c.check==='attend'&&!c.fixed&&dayH[1]?dayH[1].h:0;

 const rate=co.rateN||0,wageN=co.wageN||0,cap=co.capN?(c.hours>=200?co.capN[2]:c.hours>=100?co.capN[1]:co.capN[0]):0,keihi=cap?Math.min(c.fee*rate,cap):c.fee*rate,wageH=tr.reduce((a,t)=>a+t.wh,0);
 const ind=c.ind.replace(/（.*?）/,'');
 return {f,d,course:co,name:c.co,rep:c.rep,addr:mid?CO.zip+' '+CO.addr:pf[2],tel:mid?CO.tel:pf[3]+(pf[3].length===2?'-0000-':'-000-')+String(c.no).padStart(4,'0'),num:mid?CO.num:String(c.no).padStart(13,'0'),
  eno:pc+'01-'+n6(c.no*101)+'-'+c.no%10,lno:pc+'-1-01-'+n6(c.no*101)+'-000',bureau:pf[0]+'労働局',sui:f.sui||(mid?cl.ans.q1||'':''),planOk:c.stage>=2||mid&&!!cl.planOk,
  H,dayH,days,dt,tr,jb,gap,rate,wageN,cap,keihi,keihiSum:keihi*c.people,wageH,wageSum:wageH*wageN,payMiss:c.miss.some(x=>/振込/.test(x)),
  vendor:f.how==='in'?'自社（部外講師を招いて実施）':S.filer==='self'?'研修会社（例）':S.t.name,mode:cr?cr.mode:'通学制',

 const head=`<button class="pch" data-act="proctog" data-k="${key}" data-o="${open?1:0}" aria-expanded="${open}"><span class="pci ${st[0]}">${st[0]==='ok'?ic('check','s'):ic(ph==='post'?'shield':ph==='chg'?'bulb':'doc','s')}</span><span class="pct"><b>${phLbl(c,ph)}</b><span class="tiny">${due.t.replace(/<[^>]+>/g,'')}</span></span>${cnt}<span class="chip ${st[0]}">${st[1]}</span></button>`;
 if(!open)return `<div class="card pc">${head}</div>`;
 const rqH=rq.length?`<div class="psec"><p class="lbl">満たす要件</p>${rq.map(r=>{const done=r.a===true||r.a==null&&Q[r.id],bad=r.a===false;return `<div class="rq ${bad?'bad':done?'ok':''}"><span class="chip ${bad?'warn':done?'ok':'mute'}">${r.a===true?'自動で確認':r.a===false?'要対応':Q[r.id]?'確認済み':'未確認'}</span><div><b>${esc(r.t)}</b>${RQH[r.id]?hq(RQH[r.id]):''}${r.n?`<p>${esc(r.n)}</p>`:''}<span class="tiny">${esc(r.src)}</span></div>${r.a==null?`<button class="btn ${Q[r.id]?'g':'o'} sm" data-act="rqok" data-id="${c.id}" data-r="${r.id}">${Q[r.id]?'取り消す':'確認した'}</button>`:''}</div>`;}).join('')}</div>`:'';
 const grp=(k,t)=>g[k].length?`<div class="psec"><p class="lbl">${t}（${g[k].length}）</p>${g[k].map(d=>kbRow(c,d)).join('')}</div>`:'';

 return `<div class="card pc open">${head}<div class="pcb"><div class="pdue">${ic('cal','s')}<div><b>${due.t}</b><p>${due.n}</p><p class="phq">「${phLbl(c,ph).replace(/（.*）/,'')}」とは${hq('ph-'+ph)}</p></div></div>
